schema_version: 1
policy:
  tier1_license_allowlist:
  - MIT
  - MIT-CMU
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - PSF-2.0
  - MIT-0
  - Apache-2.0 OR BSD-3-Clause
  conditional_tier1_licenses:
  - LGPL-2.1-only
  - MPL-2.0
  - LGPL-2.1-or-later
  - GPL-3.0-with-GCC-exception
  - BSD-3-Clause-Attribution
  require_release_approval: true
  forbid_tier1_licenses:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  exact_pins_required: true
  transitive_license_audit_required: true
  wheel_hashes_required_for_release: true
  note: Package metadata labels are provisional until wheel contents, native libraries,
    transitive dependencies, hashes, and provenance are audited.
packages:
- name: certifi
  version: 2026.11.20
  license: MPL-2.0
  tier: transitive
  purpose: TLS certificate bundle required by the HTTP client dependency chain
  verification: CONDITIONAL-MPL-2.0-transitive-review-required
  release_approved: false
  provenance:
    intended_distribution: PyPI
    verified: false
    note: Observed in the 2026-11-27 hosted dependency audit; upstream provenance and exact wheel artifact hash are not independently recorded.
  transitive_dependencies:
    status: observed-in-hosted-audit
    evidence_file: dependency-policy-report.json and pipdeptree JSON
  wheel_availability:
    status: observed-installed-in-hosted-audit
    targets:
      ubuntu_22_04_x64: observed
      windows_10_11_x64: not-yet-audited
      macos_15_arm64: not-yet-audited
