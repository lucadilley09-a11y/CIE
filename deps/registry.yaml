registry_metadata:
  source_of_truth: pyproject.toml for exact direct runtime pins; generated wheelhouse-manifest.json
    for resolved artifact identities and hashes
  python_target: '>=3.11,<3.14 (project target; per-package compatibility remains
    unverified until CI and wheel builds pass)'
  platform_targets:
  - Windows 10 x64
  - Windows 11 x64
  - Ubuntu 22.04 x64
  - macOS 15 arm64
  generated_evidence:
  - wheelhouse-manifest.json (wheel filenames, versions, sizes, SHA-256)
  - pipdeptree --json-tree (transitive dependency edges)
  - pip-licenses --format=json (installed distribution license metadata)
  - pip-audit --strict --format=json (known vulnerability audit)
  - dependency-policy-report.json (CIE dependency closure and license gate result)
  evidence_status: platform-wheelhouse-hashes-and-license-notices-verified; source-tag references recorded; CI and bundle smoke tests pending
  important: Target platforms and Python versions are requirements, not proof that
    a wheel exists or is compatible. No package is release-approved until its actual
    artifacts and transitive/native components are reviewed.
