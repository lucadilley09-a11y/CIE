schema_version: 1
policy:
  tier1_license_allowlist:
  - MIT
  - MIT-CMU
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - PSF-2.0
  - MIT-0
  - Apache-2.0 OR BSD-3-Clause
  conditional_tier1_licenses:
  - LGPL-2.1-only
  - MPL-2.0
  - LGPL-2.1-or-later
  - GPL-3.0-with-GCC-exception
  - BSD-3-Clause-Attribution
  require_release_approval: true
  forbid_tier1_licenses:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  exact_pins_required: true
  transitive_license_audit_required: true
  wheel_hashes_required_for_release: true
  note: Package metadata labels are provisional until wheel contents, native libraries,
    transitive dependencies, hashes, and provenance are audited.
packages:
- name: certifi
  version: 2026.11.20
  license: MPL-2.0
  tier: 1
  purpose: Explicitly pinned TLS certificate bundle for deterministic runtime and standalone builds
  verification: MPL-2.0 notice retained; unmodified upstream package accepted for distribution
  release_approved: true
  provenance:
    source_repository: https://github.com/certifi/python-certifi
    source_tag: 2026.11.20
    source_commit: bf6a4859116b0cba96673893e394298bbe529b1f
    intended_distribution: PyPI
    verified: true
    note: Official upstream release tag 2026.11.20 resolves to bf6a4859116b0cba96673893e394298bbe529b1f; the exact platform wheel SHA-256 values are verified against PyPI release metadata in the Phase 0 wheelhouse evidence artifact.
  transitive_dependencies:
    status: exact-direct-runtime-pin; wheel-hashes-verified-on-all-platforms
    evidence_file: platform-wheelhouse-evidence.json and dependency-policy-report.json
  wheel_availability:
    status: exact-wheel-verified-on-all-platforms
    targets:
      ubuntu_22_04_x64: observed
      windows_10_11_x64: observed
      macos_15_arm64: observed
    hashes: verified-in-platform-wheelhouse-evidence.json
  python_compatibility:
    target: 3.11, 3.12, 3.13
    verified: false
